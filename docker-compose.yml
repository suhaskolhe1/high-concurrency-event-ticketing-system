version: '3.8'

services:
  # Updated to Postgres 16
  postgres:
    image: postgres:16-alpine
    container_name: eventbooking-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eventbooking-network

  # Updated to Redis 7.4
  redis:
    image: redis:7.4-alpine
    container_name: eventbooking-redis
    ports:
      - "6379:6379"
    networks:
      - eventbooking-network

  # Modern Apache Kafka 3.7 using KRaft (No Zookeeper!)
  kafka:
    image: apache/kafka:3.7.0
    container_name: eventbooking-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - eventbooking-network

  # --- MICROSERVICES ---
  api-gateway:
    build: ./api-gateway
    container_name: eventbooking-api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_CLOUD_GATEWAY_ROUTES_0_URI=http://auth-service:8081
      - SPRING_CLOUD_GATEWAY_ROUTES_1_URI=http://event-service:8082
      - SPRING_CLOUD_GATEWAY_ROUTES_2_URI=http://inventory-service:8083
      - SPRING_CLOUD_GATEWAY_ROUTES_3_URI=http://booking-service:8084
    depends_on:
      - auth-service
      - event-service
      - inventory-service
      - booking-service
    networks:
      - eventbooking-network

  auth-service:
    build: ./auth-service
    container_name: eventbooking-auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/postgres
    depends_on:
      - postgres
    networks:
      - eventbooking-network

  event-service:
    build: ./event-service
    container_name: eventbooking-event-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/postgres
      - SPRING_DATA_REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
    networks:
      - eventbooking-network

  inventory-service:
    build: ./inventory-service
    container_name: eventbooking-inventory-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - eventbooking-network

  booking-service:
    build: ./booking-service
    container_name: eventbooking-booking-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/postgres
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - postgres
      - kafka
    networks:
      - eventbooking-network

  payment-service:
    build: ./payment-service
    container_name: eventbooking-payment-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/postgres
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - postgres
      - kafka
    networks:
      - eventbooking-network

  notification-service:
    build: ./notification-service
    container_name: eventbooking-notification-service
    ports:
      - "8086:8086"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - kafka
    networks:
      - eventbooking-network

networks:
  eventbooking-network:
    driver: bridge

volumes:
  postgres_data:
