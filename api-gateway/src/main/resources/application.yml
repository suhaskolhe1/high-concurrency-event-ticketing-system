server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: event-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/events/**
        - id: inventory-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/inventory/**
        - id: booking-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/bookings/**

jwt:
  secret: "ThisIsMySuperSecretKeyForEventBookingThatIsLongEnough"
